<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>URI Decoder</title>
</head>
<body>
    <h1>URI Decoder</h1>
    <div id="grand-layout">
        
        <div class="flex1">    
            <label for="encoded-text">Source:</label>
            <textarea id="encoded-text"></textarea>
            <button id="clear-button" type="button">Clear</button>
        </div>
        
        <div id="triangle"></div>
        
        <div class="flex1">
            <label for="decoded-text">Result:</label>
            <textarea id="decoded-text" readonly></textarea>
            <button id="copy-button" type="button">Copy</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
